<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krishnalatha Deals</title>

<style>
body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f1f3f6;
}

/* HEADER */
.header{
background:#131921;
color:#fff;
display:flex;
align-items:center;
padding:10px 15px;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.logo{
color:#ffb84d;
font-weight:bold;
font-size:22px;
white-space:nowrap;
}

/* SEARCH */
.search{
flex:1;
display:flex;
margin-left:15px;
}

.search input{
width:100%;
padding:11px;
border:none;
outline:none;
border-radius:6px 0 0 6px;
font-size:15px;
}

.search button{
background:#febd69;
border:none;
padding:0 18px;
cursor:pointer;
font-size:18px;
border-radius:0 6px 6px 0;
transition:.3s;
}

.search button:hover{
background:#f3a847;
}

/* TOP STRIP */

.scroll-strip{
overflow:hidden;
background:#0f1115;
padding:8px 0;
}

.scroll-track{
display:flex;
gap:25px;
width:max-content;
animation:scroll-left 20s linear infinite;
}

.scroll-item{
color:#fff;
font-weight:bold;
padding:8px 18px;
background:rgba(255,255,255,.08);
border-radius:30px;
font-size:13px;
white-space:nowrap;
}

@keyframes scroll-left{
0%{transform:translateX(0);}
100%{transform:translateX(-50%);}
}
.flipkart-logo{
    height:65px !important;
    width:auto;
    object-fit:contain;
}


/* BRAND BAR */

.brand-bar{

display:flex;

gap:18px;

overflow-x:auto;

padding:20px;

background:#fff;

scrollbar-width:none;

}

.brand-bar::-webkit-scrollbar{
display:none;
}

.brand{

flex:0 0 auto;

width:150px;

height:110px;

background:#fff;

border-radius:18px;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

cursor:pointer;

box-shadow:0 6px 20px rgba(0,0,0,.12);

transition:.35s;

border:1px solid #ececec;

}

.brand:hover{

transform:translateY(-8px);

box-shadow:0 12px 28px rgba(0,0,0,.20);

}

.brand img{

width:58px;

height:58px;

object-fit:contain;

margin-bottom:8px;

}

.brand span{

font-weight:bold;

font-size:14px;

color:#222;

text-align:center;

}

/* SOCIAL */

.social{

position:fixed;

right:15px;

bottom:25px;

display:flex;

flex-direction:column;

gap:12px;

z-index:1000;

}

.social a{

width:46px;

height:46px;

display:flex;

align-items:center;

justify-content:center;

border-radius:50%;

box-shadow:0 5px 15px rgba(0,0,0,.25);

transition:.3s;

}

.social a:hover{

transform:scale(1.15);

}

.social img{

width:22px;

}

.wa{background:#25D366;}
.tg{background:#0088CC;}
.yt{background:#FF0000;}
.ig{background:#E4405F;}
.fb{background:#1877F2;}


  /* ================= MOBILE RESPONSIVE ================= */

@media (max-width:768px){

.header{
flex-direction:column;
align-items:stretch;
padding:12px;
gap:8px;
}

.logo{
font-size:20px;
text-align:center;
margin-bottom:10px;
}

.search{
margin:0;
width:100%;
display:flex;
}
  .search input{
flex:1;
}
.search input{
font-size:14px;
padding:10px;
}

.search button{
padding:0 14px;
font-size:16px;
}


.brand-bar{
padding:10px;
gap:10px;
margin-top:6px;
}

.brand{
width:90px;
height:90px;
border-radius:14px;
padding:8px;
}

.brand img{
width:50px;
height:50px;
object-fit:contain;
}

.scroll-item{
font-size:11px;
padding:6px 10px;
}

.social{
right:8px;
bottom:10px;
}

.social a{
width:40px;
height:40px;
}

}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
<div class="logo">Krishnalatha Deals</div>

<div class="search">
<input placeholder="Search product (e.g. Samsung S23 FE)">
<button>🔍</button>
</div>
</div>

<!-- TOP SCROLL -->
<div class="scroll-strip">
<div class="scroll-track">

<div class="scroll-item">🔥 Amazon Mega Offers</div>
<div class="scroll-item">⚡ Flipkart Big Savings</div>
<div class="scroll-item">💄 Myntra Fashion Sale</div>
<div class="scroll-item">🛍 Meesho Lowest Price</div>
<div class="scroll-item">🏷 Ajio Premium Deals</div>

<div class="scroll-item">🔥 Amazon Mega Offers</div>
<div class="scroll-item">⚡ Flipkart Big Savings</div>
<div class="scroll-item">💄 Myntra Fashion Sale</div>
<div class="scroll-item">🛍 Meesho Lowest Price</div>
<div class="scroll-item">🏷 Ajio Premium Deals</div>

</div>
</div>




<!-- ================= PREMIUM BRAND BAR ================= -->

<div class="brand-bar">

<!-- AMAZON -->
<div class="brand" onclick="location.href='amazon.html'">
<img src="images/amazon.png" alt="Amazon">
</div>

<!-- FLIPKART -->
<div class="brand" onclick="location.href='flipkart.html'">
<img src="images/flipkart.png" class="flipkart-logo" alt="Flipkart">
</div>

<!-- MYNTRA -->
<div class="brand" onclick="location.href='myntra.html'">
<img src="images/myntra.png" alt="Myntra">
</div>

<!-- MEESHO -->
<div class="brand" onclick="location.href='meesho.html'">
<img src="images/meesho.png" alt="Meesho">
</div>

<!-- AJIO -->
<div class="brand" onclick="location.href='ajio.html'">
<img src="images/ajio.png" alt="AJIO">
</div>

<!-- RELIANCE DIGITAL -->
<div class="brand" onclick="location.href='reliancedigital.html'">
<img src="images/reliance.png" alt="Reliance Digital">
</div>

<!-- PRODUCT COMPARISON -->
<div class="brand" onclick="location.href='comparison.html'">
<div style="font-size:48px;">⚖️</div>
<span>Compare</span>
</div>

</div>

<!-- SOCIAL MEDIA -->
<div class="social">

<a class="wa"><img src="https://cdn-icons-png.flaticon.com/512/733/733585.png"></a>
<a class="tg"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png"></a>
<a class="yt"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png"></a>
<a class="ig"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png"></a>
<a class="fb"><img src="https://cdn-icons-png.flaticon.com/512/733/733547.png"></a>

</div>

<script>


/* ================= PREMIUM BRAND CLICK EFFECT ================= */

document.querySelectorAll(".brand").forEach(card=>{

card.addEventListener("mousedown",()=>{

card.style.transform="scale(.96)";

});

card.addEventListener("mouseup",()=>{

card.style.transform="translateY(-8px)";

});

card.addEventListener("mouseleave",()=>{

card.style.transform="";

});

});


/* ================= SCROLL TO TOP ================= */

window.addEventListener("load",()=>{

window.scrollTo({
top:0,
behavior:"smooth"
});

});

</script>
